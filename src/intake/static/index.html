<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>netAgent Support</title>
  <style>
    :root { --bg:#0f172a; --panel:#1e293b; --accent:#4472c4; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
           background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
    header { padding:16px 20px; background:var(--panel); border-bottom:1px solid #334155; }
    header h1 { margin:0; font-size:18px; }
    header p { margin:4px 0 0; font-size:13px; color:var(--muted); }
    #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
    .msg { max-width:720px; padding:12px 16px; border-radius:12px; line-height:1.5; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--accent); color:#fff; }
    .bot  { align-self:flex-start; background:var(--panel); border:1px solid #334155; }
    .meta { font-size:12px; color:var(--muted); margin-top:8px; padding-top:8px; border-top:1px solid #334155; }
    .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
    .auto_reply { background:#166534; color:#dcfce7; }
    .suggest_to_staff { background:#854d0e; color:#fef9c3; }
    .escalate { background:#7f1d1d; color:#fee2e2; }
    form { display:flex; gap:10px; padding:16px 20px; background:var(--panel); border-top:1px solid #334155; }
    input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #475569;
            background:#0f172a; color:var(--text); font-size:15px; }
    button { padding:12px 20px; border:0; border-radius:10px; background:var(--accent);
             color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.5; cursor:default; }
  </style>
</head>
<body>
  <header>
    <h1>netAgent Support Intelligence</h1>
    <p>Đặt câu hỏi về netAgent/netFlow. Hệ thống truy xuất giải pháp đã xác thực từ cơ sở tri thức.</p>
  </header>

  <div id="chat">
    <div class="msg bot">Chào bạn! Mình có thể giúp gì? Ví dụ: "workflow của em bị mất publish".</div>
  </div>

  <form id="form">
    <input id="q" placeholder="Nhập câu hỏi…" autocomplete="off" autofocus />
    <button id="send" type="submit">Gửi</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const send = document.getElementById("send");

    function bubble(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    const DECISION_LABEL = {
      auto_reply: "Tự động trả lời",
      suggest_to_staff: "Gợi ý (cần KTV xác nhận)",
      escalate: "Chuyển KTV xử lý",
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      bubble(question, "user");
      input.value = "";
      send.disabled = true;

      const pending = bubble("…", "bot");
      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        pending.textContent = data.answer || "(không có câu trả lời)";
        const meta = document.createElement("div");
        meta.className = "meta";
        const label = DECISION_LABEL[data.decision] || data.decision;
        meta.innerHTML =
          `<span class="badge ${data.decision}">${label}</span>` +
          ` &nbsp; độ tin cậy: ${(data.confidence * 100).toFixed(0)}%` +
          (data.source_thread_id ? ` &nbsp; nguồn: ${data.source_thread_id}` : "");
        pending.appendChild(meta);
      } catch (err) {
        pending.textContent = "Lỗi kết nối tới server: " + err;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
